name: Validate Criminal Risk Assessment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f Main/index.html
          test -f Main/script.js
          test -f Main/styles.css
          test -f Main/submitted.html
          test -f Main/pug/template.pug
          echo "All required project files are present."

      - name: Validate JavaScript
        run: |
          node --check Main/script.js
          echo "JavaScript syntax is valid."

      - name: Validate HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              "Main/index.html",
              "Main/submitted.html"
          ]

          for file in files:
              text = Path(file).read_text(encoding="utf-8")
              if "<html" not in text.lower():
                  raise Exception(f"{file} does not appear to be a valid HTML file")
              print(f"{file} checked successfully.")
          PY

      - name: Validate Pug file
        run: |
          test -s Main/pug/template.pug
          echo "Pug template exists and is not empty."

      - name: Workflow completed
        run: echo "Criminal Risk Assessment project validation completed successfully."
